# Remote MCP endpoints for this repository. All install scripts read this file.
#
# Format: name=url[|transport[|HeaderName:$ENV_VAR ...]]
#
#   name=url                          SSE transport, no auth
#   name=url|http                     streamable HTTP, no auth
#   name=url|http|HeaderName:$VAR     streamable HTTP, header value from env var
#
# Entries whose $ENV_VAR is unset are skipped with a warning.
#
# This file is for the devcontainer and Codespaces only. install-mcps.sh, which
# ships in the container image, reads it from scripts/post-create.sh. After
# editing, run install-mcps.sh inside the container.
#
# Local clones do not use this file at all. scripts/setup-local.sh is
# self-contained and registers only the shadcn MCP server.
#
# The shadcn MCP is not listed here either way: it runs out of node_modules and
# is registered per-agent rather than as a remote endpoint.

# The LCA engine this app calculates against, same host as VITE_LCA_API_BASE.
lca=https://lca.mathplosion.com/mcp|http

# Stitch design MCP. Requires STITCH_API_KEY in the environment, or as a
# Codespace secret declared in .devcontainer/devcontainer.json.
stitch=https://stitch.googleapis.com/mcp|http|X-Goog-Api-Key:$STITCH_API_KEY
